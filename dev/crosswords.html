<!DOCTYPE html>
<html lang="en" manifest="../manifest.appcache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Development Version - Crosswords (Palavras Cruzadas) optimized for Amazon Kindle E-Readers.">
    <title data-i18n="crosswords_title">Palavras Cruzadas (DEV)</title>
    <link rel="stylesheet" href="../css/style.css?v=21">
    <link rel="stylesheet" href="./css/crosswords.css?v=3">
    <script>
        // Prefix for lang.js to find locales from subfolder
        window.LOCALES_PREFIX = '../';
    </script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <a href="../index.html" class="btn" data-i18n="back_menu" style="padding: 2px 10px;">Menu</a>
            </div>
            <span class="brand-text">nullcomma.com</span>
            <div class="header-right">
                <h1 data-i18n="crosswords_title">Palavras Cruzadas</h1>
            </div>
        </header>

        <main>
            <div id="setup-screen" style="text-align: center; margin-top: 20px;">
                <img src="../img/thumb_crosswords.png" class="detail-thumb" id="dev-thumb" alt="">
                <p data-i18n="crosswords_rules" style="margin: 15px 10px; font-size: 16px; border: 1px solid black; padding: 10px;"></p>
                <div class="mode-selector" style="margin: 20px 0;">
                    <button class="btn" id="btn-cw-easy" data-i18n="diff_easy" onclick="startGame('easy')">Fácil</button>
                    <button class="btn" id="btn-cw-med" data-i18n="diff_med" onclick="startGame('medium')">Médio</button>
                    <button class="btn" id="btn-cw-hard" data-i18n="diff_hard" onclick="startGame('hard')">Difícil</button>
                </div>
            </div>

            <div id="game-screen" style="display: none;">
                <div class="status-message" id="status-message"></div>

                <div class="crosswords-board" id="crosswords-board">
                </div>

                <div class="crosswords-clues" id="crosswords-clues" style="margin: 10px auto; width: 320px; text-align: left;">
                    <div class="clues-col" style="float: left; width: 48%; margin-right: 4%;">
                        <strong data-i18n="crosswords_across" style="display:block; border-bottom:1px solid black; margin-bottom:5px;">Horizontais</strong>
                        <ul id="clues-across" style="font-size: 11px; margin: 0; padding-left: 10px; list-style-type: none;"></ul>
                    </div>
                    <div class="clues-col" style="float: left; width: 48%;">
                        <strong data-i18n="crosswords_down" style="display:block; border-bottom:1px solid black; margin-bottom:5px;">Verticais</strong>
                        <ul id="clues-down" style="font-size: 11px; margin: 0; padding-left: 10px; list-style-type: none;"></ul>
                    </div>
                    <div class="clearfix"></div>
                </div>

                <div class="hangman-kb" id="crosswords-kb" style="margin-top: 15px;">
                    <!-- Buttons injected by JS -->
                </div>
                
                <div class="controls" style="margin-top: 20px;">
                    <button class="btn" id="btn-reset-game" data-i18n="play_again" onclick="backToMenu()">Jogar Novamente</button>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/lang.js?v=8"></script>
    <script src="./js/crosswords.js?v=4"></script>
    <script src="../js/scale.js?v=1"></script>
</body>
</html>
